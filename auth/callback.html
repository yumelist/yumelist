<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yumelist — Email confirmado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0F0A1E;
    color: #F2EBFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: #1A132E;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .header {
    background: linear-gradient(135deg, #C8A2E0 0%, #FFAACC 100%);
    padding: 40px 24px;
    text-align: center;
  }
  .logo { font-size: 42px; font-weight: 800; color: #0F0A1E; }
  .tagline { font-size: 13px; color: #0F0A1E; opacity: 0.7; margin-top: 4px; }
  .content { padding: 36px 28px; text-align: center; }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #F2EBFF; }
  p { font-size: 15px; line-height: 1.6; color: #B8A8DB; margin-bottom: 24px; }
  .open-app {
    display: inline-block;
    background: linear-gradient(135deg, #C8A2E0 0%, #FFAACC 100%);
    color: #0F0A1E; font-weight: 700; font-size: 15px;
    text-decoration: none; padding: 14px 32px; border-radius: 999px;
    box-shadow: 0 4px 16px rgba(200,162,224,0.4);
  }
  .footer {
    background: #0F0A1E; padding: 20px; text-align: center;
    border-top: 1px solid #2A1F4A;
  }
  .footer a { color: #C8A2E0; text-decoration: none; font-size: 12px; }
  .small { font-size: 12px; color: #6F5F9A; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">Yumelist 🌸</div>
    <div class="tagline">sua lista dos sonhos</div>
  </div>
  <div class="content">
    <div class="icon">✅</div>
    <h1>Email confirmado!</h1>
    <p>Sua conta tá ativa. Volta pro app e entra com seu email e senha.</p>
    <a href="app.yumelist://login-callback" class="open-app">Abrir o Yumelist</a>
    <p class="small">Se o app não abrir automaticamente, é só voltar manualmente — sua conta já tá pronta.</p>
  </div>
  <div class="footer">
    <a href="https://yumelist.github.io/yumelist/">yumelist.github.io</a>
    &nbsp;·&nbsp;
    <a href="https://yumelist.github.io/yumelist/privacy.html">Privacidade</a>
  </div>
</div>
<script>
  setTimeout(() => { window.location.href = 'app.yumelist://login-callback'; }, 1500);
</script>
</body>
</html>
